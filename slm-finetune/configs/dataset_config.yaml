# configs/dataset_config.yaml

preprocessing:
  max_seq_length: 512
  stride: 256
  pad_to_multiple_of: 8
  overwrite_cache: false

datasets:
  - name: "TinyStories"
    path: "roneneldan/TinyStories"
    config: null
    train_split: "train"
    validation_split: "validation"
    text_column: "text"
    format: "raw"
    max_samples: 3000

  - name: "wikitext-103"
    path: "Salesforce/wikitext"
    config: "wikitext-103-v1"
    train_split: "train"
    validation_split: "validation"
    text_column: "text"
    format: "raw"
    max_samples: 3000

  - name: "openwebtext"
    path: "Skylion007/openwebtext"
    config: null
    train_split: "train"
    validation_split: null
    val_split_percentage: 5
    text_column: "text"
    format: "raw"
    max_samples: 4000

  - name: "ag_news"
    path: "fancyzhx/ag_news"
    config: null
    train_split: "train"
    validation_split: "test"
    text_column: "text"
    format: "template"
    template: "Text: {text}\nCategory: {label}"
    max_samples: 2500

  - name: "yelp_review_full"
    path: "Yelp/yelp_review_full"
    config: null
    train_split: "train"
    validation_split: "test"
    text_column: "text"
    format: "template"
    template: "Review: {text}\nRating: {label}"
    max_samples: 2500

  - name: "cnn_dailymail"
    path: "ccdv/cnn_dailymail"
    config: "3.0.0"
    train_split: "train"
    validation_split: "validation"
    text_column: "article"
    format: "template"
    template: "Article: {article}\nSummary: {highlights}"
    max_samples: 2000

  - name: "xsum"
    path: "EdinburghNLP/xsum"
    config: null
    train_split: "train"
    validation_split: "validation"
    text_column: "document"
    format: "template"
    template: "Document: {document}\nSummary: {summary}"
    max_samples: 2000

  - name: "daily_dialog"
    path: "DeepPavlov/daily_dialog"
    config: null
    train_split: "train"
    validation_split: "validation"
    text_column: "dialog"
    format: "dialog"
    max_samples: 2000

  - name: "squad"
    path: "rajpurkar/squad"
    config: null
    train_split: "train"
    validation_split: "validation"
    text_column: "context"
    format: "template"
    template: "Context: {context}\nQuestion: {question}\nAnswer: {answers[text][0]}"
    max_samples: 2500

  - name: "imdb_reviews"
    path: "stanfordnlp/imdb"
    config: null
    train_split: "train"
    validation_split: "test"
    text_column: "text"
    format: "template"
    template: "Movie Review: {text}\nSentiment: {label}"
    max_samples: 2000

  - name: "amazon_reviews"
    path: "SetFit/amazon_reviews_multi_en"
    config: null
    train_split: "train"
    validation_split: "validation"
    text_column: "text"
    format: "template"
    template: "Product Review: {text}"
    max_samples: 2000
