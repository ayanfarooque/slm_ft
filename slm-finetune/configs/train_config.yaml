# configs/train_config.yaml

model:
  model_name_or_path: "EleutherAI/pythia-410m"
  use_cache: false                    # Set to false when gradient checkpointing is enabled
  torch_dtype: "bfloat16"             # RTX 4060 supports bf16
  device_map: "auto"

training_args:
  output_dir: "./outputs/pythia-410m-lora"
  
  # Optimization & Precision
  fp16: false                         # Set to false since we use bf16
  bf16: true                          # RTX 4060 supports bf16
  gradient_checkpointing: true        # Critical for fitting in 8GB VRAM
  
  # Batch Sizes & Accumulation
  per_device_train_batch_size: 2      # Conservative for 8GB VRAM (range 1-2)
  per_device_eval_batch_size: 2
  gradient_accumulation_steps: 8      # Effective batch size = 2 * 8 = 16
  
  # Learning Rate Schedule
  learning_rate: 2.0e-4               # Standard for QLoRA
  weight_decay: 0.01
  adam_beta1: 0.9
  adam_beta2: 0.999
  adam_epsilon: 1.0e-8
  max_grad_norm: 1.0
  lr_scheduler_type: "cosine"
  warmup_ratio: 0.03
  
  # Steps & Epochs
  num_train_epochs: 1
  logging_steps: 10
  eval_steps: 100
  save_steps: 100
  evaluation_strategy: "steps"
  save_strategy: "steps"
  save_total_limit: 3
  load_best_model_at_end: true
  metric_for_best_model: "eval_loss"
  
  # Performance
  dataloader_num_workers: 2
  group_by_length: true               # Group sequences of similar length to speed up training
  ddp_find_unused_parameters: false

logging:
  report_to:
    - "wandb"
  wandb:
    project: "slm-finetune"
    name: "pythia-410m-qlora-multi-dataset"
    log_model: "checkpoint"
    tags:
      - "model=pythia-410m"
      - "lora_rank=8"
      - "dataset_version=scaled_v1"
